# Live LLM integration test: MANUAL ONLY (workflow_dispatch).
# This is the only workflow allowed to reference an API-key secret, and it
# never runs on push or pull_request (docs/SECURITY_DESIGN.md).
# Running it is a paid-API action and requires explicit human intent.
name: live-llm-manual

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "run-live" to confirm a paid live-LLM test run'
        required: true

permissions:
  contents: read

jobs:
  live-integration:
    if: github.event.inputs.confirm == 'run-live' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies (with live extra)
        run: uv sync --frozen --extra live

      - name: Live smoke test (single case)
        env:
          MEDRISK_LLM_MODE: live
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run python scripts/live_llm_smoke.py
